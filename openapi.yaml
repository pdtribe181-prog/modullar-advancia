openapi: 3.0.3
info:
  title: Advancia PayLedger API
  description: Healthcare payment and compliance management platform
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:3000
    description: Development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [patient, provider, admin, staff]
        phone:
          type: string
        is_active:
          type: boolean
    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        specialty:
          type: string
        license_number:
          type: string
        consultation_fee:
          type: number
        rating:
          type: number
        bio:
          type: string
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        insurance_provider:
          type: string
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        status:
          type: string
          enum: [scheduled, completed, cancelled, no_show, rescheduled]
        reason_for_visit:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        payment_status:
          type: string
          enum: [pending, completed, failed, refunded, cancelled]
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoice_number:
          type: string
        total_amount:
          type: number
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled, refunded]
    SecurityPreferences:
      type: object
      properties:
        emailNotifications:
          type: boolean
          description: Enable email security notifications
        smsNotifications:
          type: boolean
          description: Enable SMS security notifications
        notifyOnLogin:
          type: boolean
          description: Notify on new login
        notifyOnPasswordChange:
          type: boolean
          description: Notify when password is changed
        notifyOnEmailChange:
          type: boolean
          description: Notify when email is changed
        notifyOnNewDevice:
          type: boolean
          description: Notify when logging in from new device
    SecurityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [login, logout, password_changed, email_changed, phone_changed, mfa_enabled, mfa_disabled, mfa_challenged, recovery_initiated, recovery_completed, identity_linked, identity_unlinked, failed_login, suspicious_activity]
        ip_address:
          type: string
        user_agent:
          type: string
        location:
          type: object
        created_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                fullName:
                  type: string
                role:
                  type: string
                  enum: [patient, provider]
                  default: patient
      responses:
        '200':
          description: User registered
        '400':
          description: Invalid input

  /auth/login:
    post:
      summary: Sign in user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Sign in successful
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Sign out user
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Signed out

  /auth/csrf-token:
    get:
      summary: Get CSRF token
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSRF token returned

  /auth/profile:
    get:
      summary: Get current user profile via auth
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
    put:
      summary: Update user profile via auth
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                avatar_url:
                  type: string
      responses:
        '200':
          description: Profile updated

  /auth/refresh:
    post:
      summary: Refresh session token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens returned
        '401':
          description: Invalid refresh token

  /auth/session:
    get:
      summary: Get current session info
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session information

  /auth/phone/signup:
    post:
      summary: Sign up with phone number
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                fullName:
                  type: string
                role:
                  type: string
                  enum: [patient, provider]
      responses:
        '200':
          description: OTP sent via SMS

  /auth/phone/signin:
    post:
      summary: Sign in with phone number
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: OTP sent

  /auth/phone/verify:
    post:
      summary: Verify phone OTP
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, token]
              properties:
                phone:
                  type: string
                token:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: Phone verified, session returned

  /auth/phone/resend:
    post:
      summary: Resend phone OTP
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: OTP resent

  /auth/phone:
    put:
      summary: Update phone number
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: Phone updated

  /auth/mfa/factors:
    get:
      summary: List enrolled MFA factors
      tags: [MFA]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of MFA factors

  /auth/mfa/factors/{factorId}:
    delete:
      summary: Unenroll MFA factor
      tags: [MFA]
      security:
        - BearerAuth: []
      parameters:
        - name: factorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Factor unenrolled

  /auth/mfa/assurance:
    get:
      summary: Get MFA assurance level
      tags: [MFA]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current MFA assurance level

  /auth/email/resend-confirmation:
    post:
      summary: Resend email confirmation
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Confirmation email resent

  /auth/email:
    put:
      summary: Update email address
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Email updated

  /auth/password/reset:
    post:
      summary: Reset password with token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset

  /auth/password:
    put:
      summary: Change password
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password changed

  /auth/forgot-password:
    post:
      summary: Request password reset email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid email or rate limit exceeded

  /profile:
    get:
      summary: Get current user profile
      tags: [Profile]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    patch:
      summary: Update current user profile
      tags: [Profile]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Profile updated

  /provider:
    get:
      summary: List providers
      description: |
        Returns a paginated list of providers. Admins see all providers;
        patients see only active providers. Supports search and specialty filter.
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: specialty
          in: query
          schema:
            type: string
          description: Filter by specialty (case-insensitive partial match)
        - name: search
          in: query
          schema:
            type: string
          description: Search by business name or specialty
      responses:
        '200':
          description: Paginated provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Provider'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer

  /providers:
    get:
      summary: List all providers
      tags: [Providers]
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'

  /providers/{id}:
    get:
      summary: Get provider by ID
      tags: [Providers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provider details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '404':
          description: Provider not found

  /providers/specialty/{specialty}:
    get:
      summary: Find providers by specialty
      tags: [Providers]
      parameters:
        - name: specialty
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'

  /provider/me:
    get:
      summary: Get provider profile
      tags: [Providers]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Provider profile
    put:
      summary: Update provider profile
      tags: [Providers]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                specialty:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                consultationFee:
                  type: number
                bio:
                  type: string
      responses:
        '200':
          description: Profile updated

  /provider/appointments:
    get:
      summary: Get provider appointments
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Provider appointments

  /provider/appointments/{id}:
    get:
      summary: Get provider appointment detail
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment detail

  /provider/appointments/{id}/confirm:
    post:
      summary: Confirm appointment
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment confirmed

  /provider/appointments/{id}/complete:
    post:
      summary: Complete appointment
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Appointment completed

  /provider/appointments/{id}/cancel:
    post:
      summary: Cancel appointment (provider)
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Appointment cancelled

  /provider/earnings:
    get:
      summary: Get provider earnings summary
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Earnings summary

  /provider/schedule:
    get:
      summary: Get provider schedule
      tags: [Providers]
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Scheduled appointments

  /patients:
    get:
      summary: List all patients
      tags: [Patients]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'

  /patients/{id}:
    get:
      summary: Get patient by ID
      tags: [Patients]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

  /appointments/book:
    post:
      summary: Create appointment
      tags: [Appointments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, provider_id, appointment_date, appointment_time]
              properties:
                patient_id:
                  type: string
                  format: uuid
                provider_id:
                  type: string
                  format: uuid
                appointment_date:
                  type: string
                  format: date
                appointment_time:
                  type: string
                  format: time
                reason_for_visit:
                  type: string
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'

  /appointments/my-appointments:
    get:
      summary: Get current user's appointments
      tags: [Appointments]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'

  /appointments/providers:
    get:
      summary: Get available providers for appointments
      tags: [Appointments]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of available providers

  /appointments/providers/{providerId}/availability:
    get:
      summary: Get provider availability
      tags: [Appointments]
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Available time slots

  /appointments/{id}:
    get:
      summary: Get appointment details
      tags: [Appointments]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'

  /appointments/{id}/cancel:
    post:
      summary: Cancel appointment
      tags: [Appointments]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Appointment cancelled

  /appointments/{id}/reschedule:
    post:
      summary: Reschedule appointment
      tags: [Appointments]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, time]
              properties:
                date:
                  type: string
                  format: date
                time:
                  type: string
      responses:
        '200':
          description: Appointment rescheduled

  /transactions:
    get:
      summary: Get authenticated user transactions
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
    post:
      summary: Create transaction
      tags: [Transactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, provider_id, amount]
              properties:
                patient_id:
                  type: string
                  format: uuid
                provider_id:
                  type: string
                  format: uuid
                appointment_id:
                  type: string
                  format: uuid
                amount:
                  type: number
                currency:
                  type: string
                payment_method:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Transaction created

  /transactions/by-provider:
    post:
      summary: Get transactions by provider
      tags: [Transactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: List of transactions

  /transactions/by-patient:
    post:
      summary: Get patient transactions
      tags: [Transactions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patientId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /invoices:
    get:
      summary: Get invoices
      tags: [Invoices]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'

  /invoices/{id}:
    get:
      summary: Get invoice details
      tags: [Invoices]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice detail with line items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /disputes:
    get:
      summary: List all disputes
      tags: [Disputes]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of disputes
    post:
      summary: Create dispute
      tags: [Disputes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dispute_number, dispute_reason, amount]
              properties:
                dispute_number:
                  type: string
                transaction_id:
                  type: string
                  format: uuid
                dispute_reason:
                  type: string

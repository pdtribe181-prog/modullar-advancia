# Preview Environment Deployment
# Deploys a preview environment for each PR

name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_BASE: healthcare-api-pr

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE }}-${{ github.event.pull_request.number }}:${{ github.sha }} \
            --build-arg NODE_ENV=preview \
            .

      - name: Push to GCR
        run: docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE }}-${{ github.event.pull_request.number }}:${{ github.sha }}

      - name: Deploy to Cloud Run (Preview)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_BASE }}-${{ github.event.pull_request.number }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE }}-${{ github.event.pull_request.number }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --timeout=60s
          env_vars: |
            NODE_ENV=preview
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_TEST }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=preview-pr-${{ github.event.pull_request.number }}
            FRONTEND_URL=${{ secrets.PREVIEW_FRONTEND_URL }}

      - name: Get Preview URL
        id: preview-url
        run: echo "url=${{ steps.deploy.outputs.url }}" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.preview-url.outputs.url }}';
            const body = `## 🚀 Preview Deployment Ready!
            
            | Resource | URL |
            |----------|-----|
            | **API** | ${previewUrl} |
            | **Health** | ${previewUrl}/health |
            | **Docs** | ${previewUrl}/docs |
            
            ### Environment Info
            - **PR**: #${{ github.event.pull_request.number }}
            - **Commit**: \`${{ github.sha }}\`
            - **Branch**: \`${{ github.head_ref }}\`
            
            > ⚠️ This preview uses **test mode** Stripe keys and a shared database.
            > Preview environments auto-delete when PR is closed.`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Preview Deployment Ready')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    permissions:
      id-token: write

    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Delete Preview Service
        run: |
          gcloud run services delete ${{ env.SERVICE_BASE }}-${{ github.event.pull_request.number }} \
            --region=${{ env.REGION }} \
            --quiet || true
          
          # Also delete the container image
          gcloud container images delete \
            gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_BASE }}-${{ github.event.pull_request.number }} \
            --force-delete-tags \
            --quiet || true

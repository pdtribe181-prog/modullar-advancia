# CI/CD Pipeline — Advancia PayLedger
# Full pipeline: lint → test → build → deploy
# Manual-only (workflow_dispatch) to avoid duplicating PR CI.
# Use for ad-hoc full pipeline runs and future deploy steps.
#
# Required GitHub Secrets (for deploy jobs — both environments):
#   VPS_SSH_HOST  — Hostinger VPS IP or hostname (76.13.77.8)
#   VPS_SSH_USER  — SSH user on VPS (e.g. root)
#   VPS_SSH_KEY   — Private SSH key (RSA/ED25519, no passphrase)
#
# Required GitHub Environments:
#   production — https://api.advanciapayledger.com
#   staging    — https://api-staging.advanciapayledger.com

name: CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB: Lint & Type Check
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment docs are free of legacy hosting references
        run: npm run verify:no-render-hosting

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Backend Unit Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci --forceExit
        env:
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          JWT_SECRET: test-jwt-secret-min-32-chars-long-enough

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Frontend Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm run test:run

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.advanciapayledger.com/api/v1
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Build
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Deploy to VPS (Staging)
  # Staging is not provisioned on the live VPS yet.
  # Expected future path: /var/www/advancia-staging (PM2: advancia-staging, port 3001)
  # Requires GitHub secrets: VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to VPS (Staging)
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    env:
      VPS_DEPLOY_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_DEPLOY_HOST }}
          username: ${{ env.VPS_DEPLOY_USER }}
          key: ${{ env.VPS_DEPLOY_KEY }}
          script: |
            set -e
            if [ ! -d /var/www/advancia-staging ]; then
              echo "Staging is not provisioned on the VPS yet; skipping deploy."
              exit 0
            fi
            cd /var/www/advancia-staging
            git fetch origin develop
            git reset --hard origin/develop
            npm ci --omit=dev
            npm run build
            pm2 restart advancia-staging || pm2 start dist/server.js --name advancia-staging -- --port 3001
            sleep 5
            curl -sf http://localhost:3001/health || (echo "❌ Staging health check failed" && exit 1)
            echo "✅ Staging deploy complete"

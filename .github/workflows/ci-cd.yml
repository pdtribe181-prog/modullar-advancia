# CI/CD Pipeline — Advancia PayLedger
# Full pipeline: lint → test → build → deploy
# Runs on push to main/develop and all pull requests
#
# Required GitHub Secrets (for deploy jobs):
#   RENDER_DEPLOY_HOOK_URL          — Render deploy-hook URL for production
#   RENDER_STAGING_DEPLOY_HOOK_URL  — Render deploy-hook URL for staging
#
# Required GitHub Environments:
#   production — https://modullar-advancia.onrender.com
#   staging    — https://modullar-advancia-staging.onrender.com

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB: Lint & Type Check
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Backend Unit Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          JWT_SECRET: test-jwt-secret-min-32-chars-long-enough

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Frontend Tests
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm run test:run

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://modullar-advancia.onrender.com
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Build
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Deploy to Production (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy hook secret
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Trigger Render Deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$HOOK_URL" \
          | grep -q "^2" && echo "Deploy triggered" || (echo "Deploy trigger failed" && exit 1)

      - name: Wait for deploy and health check
        run: |
          echo "Waiting 60 seconds for Render to start deployment..."
          sleep 60
          MAX_ATTEMPTS=20
          ATTEMPT=0
          until curl -sf https://modullar-advancia.onrender.com/health; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "Health check failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — waiting 15s..."
            sleep 15
          done
          echo "Production is healthy!"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Deploy to Staging (develop branch only)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Validate deploy hook secret
        env:
          HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_STAGING_DEPLOY_HOOK_URL secret is not configured."
            echo "Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Trigger Render Staging Deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          curl -s -X POST "$HOOK_URL"
          echo "Staging deploy triggered"

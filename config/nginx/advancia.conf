# Upstream for Node.js Backend (PM2)
upstream advancia_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. Product/App Domain (advanciapayledger.com)
# - Serves the React Application (Dashboard)
# - Serves the API at /api/*
server {
    server_name advanciapayledger.com www.advanciapayledger.com;

    # Root for React Frontend Build
    root /var/www/advancia/frontend/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/advancia.app.access.log;
    error_log /var/log/nginx/advancia.app.error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Frontend Handling (SPA Support)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://advancia_api/; # Trailing slash strips /api/ prefix if needed, or keep as is.
        # Adjusted to pass full path if your router expects /api prefix, remove trailing slash from proxy_pass
        # If Express app has routes like /api/users, use: proxy_pass http://advancia_api;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Brand Domain (advanciapayledger.com)
# - Serves the Marketing Site
# - Redirects /login or /signup to App
server {
    server_name advanciapayledger.com www.advanciapayledger.com;

    # Branding Site (Serve from branding folder)
    root /var/www/advancia-branding;
    index index.html;

    # Redirect app paths to the main app URL
    location = /login { return 301 https://advanciapayledger.com/login; }
    location = /signup { return 301 https://advanciapayledger.com/login?mode=signup; }
    location = /app { return 301 https://advanciapayledger.com; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Logs
    access_log /var/log/nginx/advancia.brand.access.log;
    error_log /var/log/nginx/advancia.brand.error.log;
}
